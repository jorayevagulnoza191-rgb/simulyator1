<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tutashmalar — interaktiv o'quv qo'llanma (8-sinf chizmachilik)</title>
<style>
:root{
  --bg:#f3f5f8; --panel:#fff; --ink:#18212c; --muted:#5a6676; --line:#dde2e9; --soft:#eef2f7;
  --accent:#1f5fbf; --accent2:#0e8a6a; --warn:#b5401f; --ok:#0e8a4a; --bad:#c0392b;
  --main:#1b1f24; --aux:#3d8fd6; --arc:#d1204a; --axis:#c0392b;
  --r:12px; --font:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--font)}
a{color:var(--accent)}
header.top{background:linear-gradient(120deg,#0f2f66,#1f5fbf 60%,#2b7bd8);color:#fff;padding:22px 24px 18px}
header.top .wrap{max-width:1240px;margin:auto}
.kicker{font-size:13px;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
header.top h1{margin:4px 0 6px;font-size:clamp(24px,3.4vw,36px);line-height:1.15}
header.top p{margin:0;opacity:.9;max-width:900px}
.topics{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.topics button{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:9px 18px;font:600 15px var(--font);cursor:pointer}
.topics button[aria-pressed=true]{background:#fff;color:#0f2f66}
.layout{max-width:1240px;margin:22px auto;padding:0 16px;display:grid;grid-template-columns:270px minmax(0,1fr);gap:22px;align-items:start}
nav.side{position:sticky;top:14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px}
nav.side h3{margin:6px 8px 10px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
nav.side button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:8px 9px;font:15px var(--font);color:var(--ink);cursor:pointer}
nav.side button .n{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--soft);font:600 13px var(--font);color:var(--muted)}
nav.side button:hover{background:var(--soft)}
nav.side button[aria-current=true]{background:#e6eefb;color:#0f2f66;font-weight:600}
nav.side button[aria-current=true] .n{background:var(--accent);color:#fff}
nav.side .tools{display:grid;gap:6px;padding:10px 6px 4px;border-top:1px solid var(--line);margin-top:8px}
nav.side .tools button{justify-content:center;border:1px solid var(--line);font-size:13px}
main{min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px 26px;margin-bottom:18px}
.sec-head{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.sec-head .big{width:46px;height:46px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center;font:700 20px var(--font);flex:none}
.sec-head h2{margin:0;font-size:24px;line-height:1.2}
.sec-head small{display:block;color:var(--muted);font-size:14px}
h3{margin:22px 0 8px;font-size:19px}
h4{margin:16px 0 6px;font-size:16px}
.note{background:#fff8e5;border:1px solid #f0d58a;border-radius:10px;padding:12px 16px;margin:14px 0}
.remember{background:#eaf6f1;border:1px solid #9fd6c2;border-radius:10px;padding:12px 16px;margin:14px 0}
.remember b:first-child{color:var(--accent2)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.fig{border:1px solid var(--line);border-radius:10px;background:#fff;padding:8px;margin:10px 0}
.fig figcaption{font-size:14px;color:var(--muted);text-align:center;padding:4px 6px 2px}
.fig svg{width:100%;height:auto;display:block}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:6px}
button.btn{font:600 15px var(--font);border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:9px 16px;cursor:pointer}
button.btn:hover{border-color:var(--muted)}
button.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.btn[aria-pressed=true]{background:#e6eefb;border-color:var(--accent);color:#0f2f66}
input[type=text],input[type=url],input[type=search]{font:15px var(--font);padding:9px 12px;border:1px solid var(--line);border-radius:9px;width:100%;background:#fff}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--soft)}
.sym{display:inline-flex;align-items:center;justify-content:center;flex:none;background-image:linear-gradient(rgba(255,255,255,.15) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.15) 1px,transparent 1px);background-size:6px 6px}
.symhead{display:flex;align-items:center;gap:14px;border-radius:16px;padding:12px 16px;margin:20px 0 10px}
.symhead b{display:block;font-size:18px}.symhead small{font-size:14px;font-weight:500}
.legend{border-top:1px solid var(--line);margin-top:8px;padding:10px 6px 4px}
.legend .row{display:flex;align-items:center;gap:10px;padding:5px 2px;font-size:14px}
.legend .row small{display:block;color:var(--muted);font-size:12px;line-height:1.2}
.editbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#fff8e5;border:1px solid #f0d58a;border-radius:10px;padding:10px 12px;margin:-6px 0 14px;font-size:14px}
.edited{font-size:13px;color:#8a6d1a;margin:-8px 0 8px}
.sec-body[contenteditable=true]{outline:2px dashed #f0b429;outline-offset:8px;border-radius:4px}
.sec-body[contenteditable=true] [contenteditable=false]{opacity:.85}
/* stepper */
.stepper{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.stepper .bar{display:flex;flex-wrap:wrap;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--soft);align-items:center}
.stepper .bar .modes{display:flex;flex-wrap:wrap;gap:6px}
.stepper .bar button{font:600 13px var(--font);padding:6px 11px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer}
.stepper .bar button[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
.stepper .body{display:grid;grid-template-columns:minmax(0,1fr) 300px}
.stepper .canvas{padding:6px;min-width:0}
.stepper .canvas svg{width:100%;height:auto;display:block}
.stepper .info{border-left:1px solid var(--line);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.stepper .stepno{font:600 13px var(--font);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.stepper .ttl{font-weight:700;font-size:17px}
.stepper .desc{color:#334;font-size:15px}
.stepper .ctrl{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.stepper .ctrl button{flex:1 1 auto}
.stepper .sl{display:grid;gap:2px;font-size:14px}
.stepper .sl input{width:100%}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:22px;height:6px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--accent)}
svg .main{stroke:var(--main);stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
svg .given{stroke:#444;stroke-width:2.2;fill:none;stroke-linecap:round}
svg .aux{stroke:var(--aux);stroke-width:1.5;fill:none;stroke-dasharray:7 5}
svg .auxs{stroke:var(--aux);stroke-width:1.5;fill:none}
svg .arc{stroke:var(--arc);stroke-width:3.6;fill:none;stroke-linecap:round}
svg .axis{stroke:var(--axis);stroke-width:1;fill:none;stroke-dasharray:22 4 3 4}
svg .dim{stroke:#222;stroke-width:1;fill:none}
svg .faded{opacity:.22}
svg text{font:italic 20px "Times New Roman",Georgia,serif;fill:#111}
svg text.lbl{font:italic 600 22px "Times New Roman",Georgia,serif}
svg text.dt{font:16px "Segoe UI",Arial,sans-serif;font-style:normal;fill:#111}
svg text.dtb{font:600 15px "Segoe UI",Arial,sans-serif;font-style:normal;fill:var(--aux)}
svg .pt{fill:#fff;stroke:var(--accent);stroke-width:2.2}
svg .hid{display:none}
svg .draw{animation:draw 1.1s ease forwards}
svg .pop{animation:pop .6s ease}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes pop{from{opacity:0}to{opacity:1}}
/* 3d */
.viewer{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px}
.viewer canvas{width:100%;aspect-ratio:4/3;background:radial-gradient(circle at 50% 40%,#fff,#dfe6ef);border:1px solid var(--line);border-radius:12px;cursor:grab;touch-action:none}
.qrbox{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;border:1px dashed #9db4d6;border-radius:12px;padding:14px;background:#f8fbff;margin:12px 0}
.qrbox .qr{width:170px;height:170px;flex:none;display:grid;place-items:center;background:#fff;border:1px solid var(--line);border-radius:8px;color:var(--muted);font-size:13px;text-align:center;padding:8px}
.qrbox .qr svg{width:100%;height:100%}
.qrbox .f{flex:1 1 240px;display:grid;gap:8px}
/* gallery */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.gal figure{margin:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;cursor:zoom-in}
.gal img{width:100%;height:220px;object-fit:contain;background:#fff;display:block;border-bottom:1px solid var(--line)}
.gal figcaption{padding:10px 12px;font-size:14px}
.gal figcaption b{display:block;font-size:15px}
.lightbox{position:fixed;inset:0;background:rgba(10,15,25,.86);display:none;place-items:center;z-index:50;padding:20px;cursor:zoom-out}
.lightbox.on{display:grid}
.lightbox img{max-width:96vw;max-height:88vh;background:#fff;border-radius:8px}
.lightbox p{color:#fff;text-align:center;margin:10px 0 0}
/* quiz */
.q{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:12px 0}
.q .qt{font-weight:600;margin-bottom:8px}
.q label{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.q label:hover{background:var(--soft)}
.q label.right{background:#e3f5ea;border-color:#8fd3a8}
.q label.wrong{background:#fde8e5;border-color:#efa59b}
.q .ex{display:none;font-size:14px;color:#2d4a3a;margin-top:6px}
.q.done .ex{display:block}
.score{font-size:18px;font-weight:700;padding:12px 16px;border-radius:10px;background:#e6eefb;margin-top:10px;display:none}
details.cq{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:10px 0;background:#fff}
details.cq summary{cursor:pointer;font-weight:600}
details.cq[open]{background:#f8fbff}
/* crossword */
.cw-wrap{display:grid;grid-template-columns:auto minmax(260px,1fr);gap:20px;align-items:start}
.cw{display:grid;gap:2px;width:max-content;max-width:100%;overflow:auto}
.cw .c{width:32px;height:32px;position:relative}
.cw .c.on{background:#fff;outline:1.5px solid #34495e}
.cw .c input{width:100%;height:100%;border:0;text-align:center;font:700 17px var(--font);text-transform:uppercase;background:transparent;padding:0}
.cw .c input:focus{background:#fff3c4;outline:none}
.cw .c .num{position:absolute;left:2px;top:0;font-size:9px;color:#333;pointer-events:none}
.cw .c.good input{background:#dff5e7}
.cw .c.badc input{background:#fde2de}
.clues ol{padding-left:22px;margin:6px 0}
.clues li{margin:4px 0;font-size:15px}
.gloss td:first-child{font-weight:700;white-space:nowrap}
.hw li{margin:8px 0}
.tag{display:inline-block;font:600 12px var(--font);padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted);margin-left:6px}
@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  nav.side{position:static}
  .stepper .body,.viewer,.cw-wrap{grid-template-columns:1fr}
  .stepper .info{border-left:0;border-top:1px solid var(--line)}
  .card{padding:16px}
}
@media print{
  header.top .topics,nav.side,.pager,.stepper .bar,.stepper .ctrl,.qrbox .f input,.no-print{display:none!important}
  .layout{display:block;margin:0}
  body{background:#fff}
  .card{break-inside:avoid-page;border:0;padding:6px 0}
  section.sec{display:block!important}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="kicker">Chizmachilik · 8-sinf · I. Rahmonov darsligi asosida</div>

    <p id="subtitle"></p>
    <div class="topics" id="topics"></div>
  </div>
</header>
<div class="layout">

    <h3>Mavzu bo'limlari</h3>
    <div id="nav"></div>
    <div class="tools">
      <button class="btn" id="editBtn" title="Bo'lim matnini o'zingiz tahrirlang">✏️ Tahrirlash</button>
      <button class="btn" id="saveFileBtn" title="O'zgarishlar bilan yangi faylni yuklab olish">💾 Faylni saqlash</button>
      <button class="btn" id="printBtn" title="Mavzuni to'liq chop etish">🖨 Chop etish</button>
    </div>
  </nav>
  <main id="main"></main>
</div>
<div class="lightbox" id="lb"><div><img id="lbImg" alt=""><p id="lbCap"></p></div></div>

<script>window.addEventListener("error",function(e){if(e&&/ResizeObserver loop/.test(e.message||"")){e.stopImmediatePropagation();e.preventDefault()}},true);</script>

<script>/* Minimal QR encoder: byte mode, ECC level M, versions 1-25 */
var QR = (function () {
  var ECC = [-1, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26, 30, 22, 22, 24, 24, 28, 28, 26, 26, 26, 26, 28, 28, 28, 28];
  var BLK = [-1, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5, 5, 8, 9, 9, 10, 10, 11, 13, 14, 16, 17, 17, 18, 20, 21];
  function rawModules(v) {
    var r = (16 * v + 128) * v + 64;
    if (v >= 2) { var n = Math.floor(v / 7) + 2; r -= (25 * n - 10) * n - 55; if (v >= 7) r -= 36; }
    return r;
  }
  function dataCw(v) { return Math.floor(rawModules(v) / 8) - ECC[v] * BLK[v]; }
  function mul(x, y) { var z = 0; for (var i = 7; i >= 0; i--) { z = (z << 1) ^ ((z >>> 7) * 0x11D); z ^= ((y >>> i) & 1) * x; } return z & 0xFF; }
  function divisor(d) {
    var r = []; for (var i = 0; i < d; i++) r.push(0); r[d - 1] = 1; var root = 1;
    for (i = 0; i < d; i++) { for (var j = 0; j < d; j++) { r[j] = mul(r[j], root); if (j + 1 < d) r[j] ^= r[j + 1]; } root = mul(root, 2); }
    return r;
  }
  function remainder(data, div) {
    var r = div.map(function () { return 0; });
    data.forEach(function (b) { var f = b ^ r.shift(); r.push(0); for (var i = 0; i < r.length; i++) r[i] ^= mul(div[i], f); });
    return r;
  }
  function utf8(s) {
    var out = [], e = unescape(encodeURIComponent(s));
    for (var i = 0; i < e.length; i++) out.push(e.charCodeAt(i));
    return out;
  }
  function alignPos(v) {
    if (v === 1) return [];
    var n = Math.floor(v / 7) + 2, size = v * 4 + 17;
    var step = Math.ceil((v * 4 + 4) / (n * 2 - 2)) * 2, res = [6];
    for (var p = size - 7; res.length < n; p -= step) res.splice(1, 0, p);
    return res;
  }
  function encode(text) {
    var bytes = utf8(text), v;
    for (v = 1; v <= 25; v++) {
      var cc = v < 10 ? 8 : 16;
      if (4 + cc + bytes.length * 8 <= dataCw(v) * 8) break;
    }
    if (v > 25) throw new Error('Matn juda uzun');
    var bits = [];
    function put(val, n) { for (var i = n - 1; i >= 0; i--) bits.push((val >>> i) & 1); }
    put(4, 4); put(bytes.length, v < 10 ? 8 : 16);
    bytes.forEach(function (b) { put(b, 8); });
    var cap = dataCw(v) * 8;
    put(0, Math.min(4, cap - bits.length));
    put(0, (8 - bits.length % 8) % 8);
    for (var pad = 0xEC; bits.length < cap; pad ^= 0xEC ^ 0x11) put(pad, 8);
    var data = [];
    for (var i = 0; i < bits.length; i += 8) { var b = 0; for (var j = 0; j < 8; j++) b = (b << 1) | bits[i + j]; data.push(b); }
    // ecc + interleave
    var nb = BLK[v], el = ECC[v], raw = Math.floor(rawModules(v) / 8);
    var nShort = nb - raw % nb, shortLen = Math.floor(raw / nb), div = divisor(el), blocks = [], k = 0;
    for (i = 0; i < nb; i++) {

      var ecc = remainder(dat, div);
      if (i < nShort) dat.push(0);
      blocks.push(dat.concat(ecc));

    var all = [];
    for (i = 0; i < blocks[0].length; i++) for (j = 0; j < blocks.length; j++)
      if (i !== shortLen - el || j >= nShort) all.push(blocks[j][i]);
    // matrix
    var size = v * 4 + 17, M = [], F = [];

    for (i = 0; i < size; i++) { set(6, i, i % 2 === 0); set(i, 6, i % 2 === 0); }
    function finder(x, y) {
      for (var dy = -4; dy <= 4; dy++) for (var dx = -4; dx <= 4; dx++) {
        var d = Math.max(Math.abs(dx), Math.abs(dy)), xx = x + dx, yy = y + dy;

    finder(3, 3); finder(size - 4, 3); finder(3, size - 4);

      for (i = 9; i < 15; i++) set(14 - i, 8, g(i));

    }
    format(0);
    if (v >= 7) {

      var vb = (v << 12) | r;
      for (i = 0; i < 18; i++) { var bt = ((vb >>> i) & 1) !== 0, a = size - 11 + i % 3, bb = Math.floor(i / 3); set(a, bb, bt); set(bb, a, bt); }
    }
    // codewords
    var bi = 0;
    for (var right = size - 1; right >= 1; right -= 2) {
      if (right === 6) right = 5;
      for (var vert = 0; vert < size; vert++) for (j = 0; j < 2; j++) {
        var x = right - j, up = ((right + 1) & 2) === 0, y = up ? size - 1 - vert : vert;
        if (!F[y][x] && bi < all.length * 8) { M[y][x] = ((all[bi >>> 3] >>> (7 - (bi & 7))) & 1) !== 0; bi++; }
      }
    }
    function maskFn(m, x, y) {
      switch (m) {
        case 0: return (x + y) % 2 === 0; case 1: return y % 2 === 0; case 2: return x % 3 === 0;
        case 3: return (x + y) % 3 === 0; case 4: return (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0;
        case 5: return x * y % 2 + x * y % 3 === 0; case 6: return (x * y % 2 + x * y % 3) % 2 === 0;
        default: return ((x + y) % 2 + x * y % 3) % 2 === 0;
      }
    }
    function applyMask(m) { for (var y = 0; y < size; y++) for (var x = 0; x < size; x++) if (!F[y][x] && maskFn(m, x, y)) M[y][x] = !M[y][x]; }
    function penalty() {
      var p = 0, x, y, run, dark = 0;

ing-left: max(16px, env(safe-area-inset-left, 0px));\n    padding-right: max(16px, env(safe-area-inset-right, 0px));\n  }\n  .wrap { max-width: 1160px; margin-inline: auto; display: grid; gap: 22px; }\n  .head h1 {\n    font: 700 clamp(28px, 5vw, 40px)/1.05 var(--font-display);\n    letter-spacing: -0.01em; margin: 0 0 6px; text-wrap: balance;\n  }\n  .head p { margin: 0; color: var(--muted); max-width: 70ch; }\n\n  .layout { display: grid; gap: 22px; align-items: start; grid-template-columns: minmax(0, 1fr) 360px; }\n  @media (max-width: 880px) { .layout { grid-template-columns: minmax(0, 1fr); } }\n\n  .stage-col { display: grid; gap: 12px; min-width: 0; }\n  .sheet {\n    aspect-ratio: 800 / 720; width: 100%; max-width: 100%;\n    border: 1px solid var(--line); border-radius: 8px; overflow: hidden;\n  }\n  .sheet canvas { display: block; width: 100%; height: 100%; }\n\n  .readout { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; font-size: 14px; }\n  #stageLabel { font-weight: 600; }\n  #spread { font: 400 13px var(--font-mono); color: var(--muted); }\n\n  .transport { display: flex; flex-wrap: wrap; gap: 8px; }\n  .transport .primary { min-width: 150px; }\n\n  button {\n    font: inherit; color: var(--ink); background: var(--panel);\n    border: 1px solid var(--line); border-radius: 6px;\n    padding: 8px 14px; min-height: 40px; cursor: pointer;\n  }\n  button:hover { border-color: var(--muted); }\n  button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }\n  button[aria-pressed=\"true\"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }\n  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }\n\n  input[type=\"range\"] { width: 100%; accent-color: var(--accent); margin: 0; display: block; }\n\n  .panel {\n    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;\n    padding: 6px 18px 18px; display: grid; min-width: 0;\n  }\n  .panel section { display: grid; gap: 12px; padding-block: 16px; border-top: 1px solid var(--line); }\n  .panel section:first-child { border-top: 0; }\n  .panel h2 {\n    margin: 0; font: 600 12px/1 var(--font-body);\n    letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted);\n  }\n  .row { display: grid; gap: 6px; }\n  .row-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }\n  .row-top output { font: 500 13px var(--font-mono); font-variant-numeric: tabular-nums; }\n\n  .steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }\n  .step {\n    width: 100%; text-align: left; display: grid; grid-template-columns: 24px minmax(0, 1fr);\n    gap: 2px 8px; align-items: baseline; padding: 8px 10px; min-height: 0;\n  }\n  .step .num { font: 500 13px var(--font-mono); color: var(--muted); }\n  .step .ttl { font-weight: 600; }\n  .step .desc { grid-column: 2; margin: 4px 0 0; color: var(--muted); font-size: 14px; }\n  .step[aria-current=\"step\"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }\n  .step[aria-current=\"step\"] .num { color: var(--accent); }\n\n  .chips { display: flex; flex-wrap: wrap; gap: 8px; }\n  .chips button { min-height: 34px; padding: 4px 12px; font-family: var(--font-mono); font-size: 13px; }\n\n  .presets { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }\n  .presets button { display: flex; align-items: center; gap: 6px; justify-content: flex-start; padding: 6px 8px; font-size: 13px; }\n  .dots { display: inline-flex; flex: none; }\n  .dots i { width: 13px; height: 13px; border-radius: 50%; border: 1px solid rgba(128,128,128,.55); margin-left: -4px; }\n  .dots i:first-child { margin-left: 0; }\n\n  .pickers { display: grid; gap: 10px; }\n  .picker { display: flex; align-items: center; justify-content: space-between; gap: 12px; }\n  input[type=\"color\"] {\n    width: 52px; height: 34px; padding: 2px; border-radius: 6px; flex: none;\n    border: 1px solid var(--line); background: var(--field); cursor: pointer;\n  }\n\n  .check { display: flex; align-items: center; gap: 10px; cursor: pointer; }\n  .check:has(input:disabled) { opacity: .5; cursor: default; }\n  .check input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }\n\n  #reset { justify-self: start; margin-top: 4px; }\n  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }\n  html { color-scheme: light; }\n  body { margin: 0; }\n  [hidden] { display: none !important; }\n  .jswarn { margin: 0; padding: 12px 14px; border-radius: 8px; background: #fff3cd; color: #5c4400; border: 1px solid #e0c060; font-weight: 600; }\n<\/style>\n<\/head>\n<body>\n\n\n<div class=\"wrap\">\n  <header class=\"head\">\n    <h1>10.4-chizma<\/h1>\n    <p>Gabarit 80\u00d770 mm, yuqori devor 10 mm, pastki tokchalar 7 mm, ichki qiya devorlar (yuqorida 60, pastda 50 mm), pastki teshik 30 mm. Tashqi burchaklar R10, ichki burchaklar R7. Chizma chizg'ich va sirkul bilan bosqichma-bosqich chiziladi, har bir o'lcham chiqqanda animatsiya to'xtaydi.<\/p>\n  <\/header>\n\n  <div class=\"layout\">\n    <section class=\"stage-col\" aria-label=\"Chizma\">\n      <noscript><p class=\"jswarn\">Bu dastur JavaScript'ni ishlatmayapti, shuning uchun chizma chiqmaydi. Faylni Google Chrome (yoki boshqa brauzer) orqali oching.<\/p><\/noscript>\n      <p class=\"jswarn\" id=\"jsErr\" hidden><\/p>\n      <div class=\"sheet\" id=\"sheet\">\n        <canvas id=\"cv\" role=\"img\" aria-label=\"10.4-chizmadagi detalning chizg'ich va sirkul bilan bosqichma-bosqich yasalishi\"><\/canvas>\n      <\/div>\n      <div class=\"readout\">\n        <span id=\"stageLabel\">Tayyor<\/span>\n        <span id=\"spread\"><\/span>\n      <\/div>\n      <div class=\"transport\">\n        <button id=\"prev\" type=\"button\">\u2039 Oldingi qadam<\/button>\n        <button id=\"play\" type=\"button\" class=\"primary\">Boshlash<\/button>\n        <button id=\"next\" type=\"button\">Keyingi qadam \u203a<\/button>\n        <button id=\"restart\" type=\"button\">Boshidan<\/button>\n      <\/div>\n      <label>\n        <span class=\"sr\">Chizish vaqti<\/span>\n        <input id=\"scrub\" type=\"range\" min=\"0\" max=\"1000\" step=\"1\" value=\"1000\">\n      <\/label>\n    <\/section>\n\n    <aside class=\"panel\" aria-label=\"Qadamlar va sozlamalar\">\n      <section>\n        <h2>Qadamlar<\/h2>\n        <ol class=\"steps\" id=\"steps\"><\/ol>\n      <\/section>\n\n      <section>\n        <h2>Tezlik<\/h2>\n        <div class=\"row\">\n          <div class=\"row-top\"><label for=\"speed\">Chizish tezligi<\/label><output id=\"speedOut\" for=\"speed\">1\u00d7<\/output><\/div>\n          <input id=\"speed\" type=\"range\" min=\"0.1\" max=\"3\" step=\"0.05\" value=\"1\">\n        <\/div>\n        <div class=\"chips\" id=\"speedChips\">\n          <button type=\"button\" data-speed=\"0.25\">0.25\u00d7<\/button>\n          <button type=\"button\" data-speed=\"0.5\">0.5\u00d7<\/button>\n          <button type=\"button\" data-speed=\"1\">1\u00d7<\/button>\n          <button type=\"button\" data-speed=\"2\">2\u00d7<\/button>\n        <\/div>\n      <\/section>\n\n      <section>\n        <h2>Ranglar<\/h2>\n        <div class=\"presets\" id=\"presets\"><\/div>\n        <div class=\"pickers\">\n          <div class=\"picker\"><label for=\"circleColor\">Detal konturi<\/label><input id=\"circleColor\" type=\"color\" value=\"#222222\"><\/div>\n          <div class=\"picker\"><label for=\"auxColor\">Yordamchi chiziqlar<\/label><input id=\"auxColor\" type=\"color\" value=\"#4aa3df\"><\/div>\n          <div class=\"picker\"><label for=\"arcColor\">Yumaloqlash yoylari (R10, R7)<\/label><input id=\"arcColor\" type=\"color\" value=\"#1f6fb2\"><\/div>\n          <div class=\"picker\"><label for=\"bg\">Varaq rangi<\/label><input id=\"bg\" type=\"color\" value=\"#ffffff\"><\/div>\n        <\/div>\n      <\/section>\n\n      <section>\n        <h2>Chiziq qalinligi<\/h2>\n        <div class=\"row\">\n          <div class=\"row-top\"><label for=\"circleW\">Detal konturi<\/label><output id=\"circleWOut\" for=\"circleW\">3.0<\/output><\/div>\n          <input id=\"circleW\" type=\"range\" min=\"1\" max=\"8\" step=\"0.5\" value=\"3\">\n        <\/div>\n        <div class=\"row\">\n          <div class=\"row-top\"><label for=\"auxW\">Yordamchi chiziqlar<\/label><output id=\"auxWOut\" for=\"auxW\">1.4<\/output><\/div>\n          <input id=\"auxW\" type=\"range\" min=\"0.5\" max=\"5\" step=\"0.1\" value=\"1.4\">\n        <\/div>\n        <div class=\"row\">\n          <div class=\"row-top\"><label for=\"arcW\">Tutashtiruvchi yoylar<\/label><output id=\"arcWOut\" for=\"arcW\">3.5<\/output><\/div>\n          <input id=\"arcW\" type=\"range\" min=\"1\" max=\"12\" step=\"0.5\" value=\"3.5\">\n        <\/div>\n      <\/section>\n\n      <section>\n        <h2>Ko'rinish<\/h2>\n        <label class=\"check\"><input id=\"compass\" type=\"checkbox\" checked> Sirkulni ko'rsatish<\/label>\n        <label class=\"check\"><input id=\"ruler\" type=\"checkbox\" checked> Chizg'ichni ko'rsatish<\/label>\n        <label class=\"check\"><input id=\"notes\" type=\"checkbox\" checked> O'lchamni chizilgan zahoti ko'rsatish<\/label>\n        <label class=\"check\"><input id=\"pause\" type=\"checkbox\" checked> O'lcham chiqqanda to'xtab turish<\/label>\n        <label class=\"check\"><input id=\"loop\" type=\"checkbox\"> Takrorlab chizish<\/label>\n        <button id=\"reset\" type=\"button\">Boshlang'ich sozlamalar<\/button>\n      <\/section>\n    <\/aside>\n  <\/div>\n<\/div>\n\n<script>\n/* eski brauzerlar uchun yordamchi funksiyalar */\nif (!Math.hypot) Math.hypot = function () { var t = 0; for (var i = 0; i < arguments.length; i++) t += arguments[i] * arguments[i]; return Math.sqrt(t); };\nif (!Object.assign) Object.assign = function (t) { for (var i = 1; i < arguments.length \n  var yA = Y(-Hmm), yP = Y(-(Hmm - Rmm));                     // a\u2013a (aylana ostida) va unga parallel chiziq\n  var Ox = -Math.sqrt(Math.pow(R1mm + Rmm, 2) - Math.pow(Hmm - Rmm, 2));\n  var OO = [X(Ox), yP];                                       // tutashtiruvchi yoy markazi O\n  var PA = [OO[0], yA];                                       // A: a\u2013a dagi urinish nuqtasi\n  var dOO = Math.hypot(OO[0] - O1[0], OO[1] - O1[1]);\n  var PB = [O1[0] + r1 * (OO[0] - O1[0]) / dOO, O1[1] + r1 * (OO[1] - O1[1]) / dOO];   // B: aylanadagi urinish nuqtasi\n\n  function ang(from, to) { return Math.atan2(to[1] - from[1], to[0] - from[0]) / D2R; }\n  function angDiff(a, b) { var d = (((b - a) % 360) + 360) % 360; return d > 180 ? d - 360 : d; }\n  var phi1 = ang(O1, OO);                                     // O\u2081 dan O ga yo'nalish\n  var aA = 90, aB = ang(OO, O1);                              // yoy A (pastda) dan B gacha\n\n  /* ---------- sirkul holati ---------- */\n  function mk(n, phi, r, off, tip) { return { n: n, phi: phi, r: r, hang: phi + off, tip: tip }; }\n  function chooseOff(a0, a1) { var ph = (a0 + a1) / 2; return Math.sin((ph - 90) * D2R) <= 0 ? -90 : 90; }\n  function lerpPose(a, b, e) {\n    return {\n      n: [a.n[0] + (b.n[0] - a.n[0]) * e, a.n[1] + (b.n[1] - a.n[1]) * e],\n      r: a.r + (b.r - a.r) * e,\n      phi: a.phi + angDiff(a.phi, b.phi) * e,\n      hang: a.hang + angDiff(a.hang, b.hang) * e,\n      tip: b.tip\n    };\n  }\n\n  /* ---------- bosqichlar ---------- */\n  var stages = [], labels = [], poseCur = null;\n  // deg: o'lcham chizig'i burchagi; ext: polka boshlanadigan nuqtaning markazdan uzoqligi (mm)\n  function diamObj(c, r, deg, text, ext) {\n    return { kind: 'diam', c: c, r: r, dx: Math.cos(deg * D2R), dy: Math.sin(deg * D2R), text: text, ext: ext * SC };\n  }\n  function radObj(c, r, deg, text, ext, side) { var o = diamObj(c, r, deg, text, ext); o.rad = true; if (side) o.side = side; return o; }\n  // vaqtinchalik o'lcham: ; accent-color: var(--accent); margin: 0; display: block; }\n\n  .panel {\n    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;\n    padding: 6px 18px 18px; display: grid; min-width: 0;\n  }\n  .panel section { display: grid; gap: 12px; padding-block: 16px; border-top: 1px solid var(--line); }\n  .panel section:first-child { border-top: 0; }\n  .panel h2 {\n    margin: 0; font: 600 12px/1 var(--font-body);\n    letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted);\n  }\n  .row { display: grid; gap: 6px; }\n  .row-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }\n  .row-top output { font: 500 13px var(--font-mono); font-variant-numeric: tabular-nums; }\n\n  .steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }\n  .step {\n    width: 100%; text-align: left; display: grid; grid-template-columns: 24px minmax(0, 1fr);\n    gap: 2px 8px; align-items: baseline; padding: 8px 10px; min-height: 0;\n  }\n  .step .num { font: 500 13px var(--font-mono); color: var(--muted); }\n  .step .ttl { font-weight: 600; }\n  .step .desc { grid-column: 2; margin: 4px 0 0; color: var(--muted); font-size: 14px; }\n  .step[aria-current=\"step\"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }\n  .step[aria-current=\"step\"] .num { color: var(--accent); }\n\n  .chips { display: flex; flex-wrap: wrap; gap: 8px; }\n  .chips button { min-height: 34px; padding: 4px 12px; font-family: var(--font-mono); font-size: 13px; }\n\n  .presets { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }\n  .presets button { display: flex; align-items: center; gap: 6px; justify-content: flex-start; padding: 6px 8px; font-size: 13px; }\n  .dots { display: inline-flex; flex: none; }\n  .dots i { width: 13px; height: 13px; border-radius: 50%; border: 1px solid rgba(128,128,128,.55); margin-left: -4px; }\n  .dots i:first-child { margin-left: 0; }\n\n  .pickers { display: grid; gap: 10px; }\n  .picker { display: flex; align-items: center; justify-content: space-between; gap: 12px; }\n  input[type=\"color\"] {\n    width: 52px; height: 34px; padding: 2px; border-radius: 6px; flex: none;\n    border: 1px solid var(--line); background: var(--field); cursor: pointer;\n  }\n\n  .check { display: flex; align-items: center; gap: 10px; cursor: pointer; }\n  .check:has(input:disabled) { opacity: .5; cursor: default; }\n  .check input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }\n\n  #reset { justify-self: start; margin-top: 4px; }\n  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }\n  html { color-scheme: light; }\n  body { margin: 0; }\n  [hidden] { display: none !important; }\n<\/style>\n<\/head>\n<body>\n\n\n<div class=\"wrap\">\n  <header class=\"head\">\n    <h1>Detal chizmasi<\/h1>\n    <p>Ikkita markaz, to'rtta aylana, urinma chiziqlar, R7 yumaloqlash va R20 tashqi tutashtirish. Chizma sirkul va chizg'ich bilan bosqichma-bosqich chiziladi. Har bir aylana yoki yoy chizilgach uning o'lchami vaqtincha ko'rsatiladi, oxirida esa barcha o'lchamlar birga qo'yiladi.<\/p>\n  <\/header>\n\n  <div class=\"layout\">\n    <section class=\"stage-col\" aria-label=\"Chizma\">\n      <div class=\"sheet\" id=\"sheet\">\n        <canvas id=\"cv\" role=\"img\" aria-label=\"Aylanalar, urinma chiziqlar va yoylardan iborat detal chizmasining sirkul bilan yasalishi\"><\/canvas>\n      <\/div>\n      <div class=\"readout\">\n        <span id=\"stageLabel\">Tayyor<\/span>\n        <span id=\"spread\"><\/span>\n      <\/div>\n      <div class=\"transport\">\n        <button id=\"prev\" type=\"button\">\u2039 Oldingi qadam<\/button>\n        <button id=\"play\" type=\"button\" class=\"primary\">Boshlash<\/button>\n        <button id=\"next\" type=\"button\">Keyingi qadam \u203a<\/button>\n        <button id=\"restart\" type=\"button\">Boshidan<\/button>\n      <\/div>\n      <label>\n        <span class=\"sr\">Chizish vaqti<\/span>\n        <input id=\"scrub\" type=\"range\" min=\"0\" max=\"1000\" step=\"1\" value=\"1000\">\n      <\/label>\n    <\/section>\n\n    <aside class=\"panel\" aria-label=\"Qadamlar va sozlamalar\">\n      <section>\n        <h2>Qadamlar<\/h2>\n        <ol class=\"steps\" id=\"steps\"><\/ol>\n      <\/section>\n\n      <section>\n        <h2>Tezlik<\/h2>\n        <div class=\"row\">\n          <div class=\"row-top\"><label for=\"speed\">Chizish tezligi<\/label><output id=\"speedOut\" for=\"speed\">1\u00d7<\/output><\/div>\n          <input id=\"speed\" type=\"range\" min=\"0.1\" max=\"3\" step=\"0.05\" value=\"1\">\n        <\/div>\n        <div class=\"chips\" id=\"speedChips\">\n          <button type=\"button\" data-speed=\"0.25\">0.25\u00d7<\/button>\n          <button type=\"button\" data-speed=\"0.5\">0.5\u00d7<\/button>\n          <button type=\"button\" data-speed=\"1\">1\u00d7<\/button>\n          <button type=\"button\" data-speed=\"2\">2\u00d7<\/button>\n        <\/div>\n      <\/section>\n\n      <section>\n        <h2>Ranglar<\/h2>\n        <div class=\"presets\" id=\"presets\"><\/div>\n        <div class=\"pickers\">\n          <div class=\"picker\"><label for=\"circleColor\">Detal konturi<\/label><input id=\"circleColor\" type=\"color\" value=\"#222222\"><\/div>\n          <div class=\"picker\"><label for=\"auxColor\">Yordamchi chiziqlar<\/label><input id=\"auxColor\" type=\"color\" value=\"#4aa3df\"><\/div>\n          <div class=\"picker\"><label for=\"arcColor\">Tutashtiruvchi yoylar (R7, R20)<\/label><input id=\"arcColor\" type=\"color\" value=\"#1f6fb2\"><\/div>\n          <div class=\"picker\"><label for=\"bg\">Varaq rangi<\/label><input id=\"bg\" type=\"color\" value=\"#ffffff\"><\/div>\n        <\/div>\n      <\/section>\n\n      <section>\n        <h2>Chiziq qalinligi<\/h2>\n        <div class=\"row\">\n          <div class=\"row-top\"><label for=\"circleW\">Detal konturi<\/label><output id=\"circleWOut\" for=\"circleW\">3.0<\/output><\/div>\n          <input id=\"circleW\" type=\"range\" min=\"1\" max=\"8\" step=\"0.5\" value=\"3\">\n        <\/div>\n        <div class=\"row\">\n          <div class=\"row-top\"><label for=\"auxW\">Yordamchi chiziqlar<\/label><output id=\"auxWOut\" for=\"auxW\">1.4<\/output><\/div>\n          <input id=\"auxW\" type=\"range\" min=\"0.5\" max=\"5\" step=\"0.1\" value=\"1.4\">\n        <\/div>\n        <div class=\"row\">\n          <div class=\"row-top\"><label for=\"arcW\">Tutashtiruvchi yoylar<\/label><output id=\"arcWOut\" for=\"arcW\">3.5<\/output><\/div>\n          <input id=\"arcW\" type=\"range\" min=\"1\" max=\"12\" step=\"0.5\" value=\"3.5\">\n        <\/div>\n      <\/section>\n\n      <section>\n        <h2>Ko'rinish<\/h2>\n        <label class=\"check\"><input id=\"compass\" type=\"checkbox\" checked> Sirkulni ko'rsatish<\/label>\n        <label class=\"check\"><input id=\"ruler\" type=\"checkbox\" checked> Chizg'ichni ko'rsatish<\/label>\n        <label class=\"check\"><input id=\"notes\" type=\"checkbox\" checked> O'lchamni chizilgan zahoti ko'rsatish<\/label>\n        <label class=\"check\"><input id=\"pause\" type=\"checkbox\" checked> O'lcham chiqqanda to'xtab turish<\/label>\n        <label class=\"check\"><input id=\"loop\" type=\"checkbox\"> Takrorlab chizish<\/label>\n        <button id=\"reset\" type=\"button\">Boshlang'ich sozlamalar<\/button>\n      <\/section>\n    <\/aside>\n  <\/div>\n<\/div>\n\n<script>\n(function () {\n  var TOP = 60, W = 800, H = 560 + TOP, D2R = Math.PI / 180;\n\n  /* ---------- geometriya: 1 mm = 9.5 birlik; O\u2081 = koordinata boshi ---------- */\n  var SC = 9.5, X0 = 155, Y0 = 330;\n  function X(x) { return X0 + SC * x; }\n  function Y(y) { return Y0 - SC * y; }\n  var O1 = [X(0), Y(0)], O2 = [X(40), Y(8)];     // O\u2082 markaz: O\u2081 dan 40 mm o'ngda, 8 mm balandda\n  var r5 = 5 * SC, r10 = 10 * SC, r11 = 11 * SC, r18 = 18 * SC, R7 = 7 * SC, R20 = 20 * SC;\n\n  function ang(from, to) { return Math.atan2(to[1] - from[1], to[0] - from[0]) / D2R; }\n  function angDiff(a, b) { var d = (((b - a) % 360) + 360) % 360; return d > 180 ? d - 360 : d; }\n\n  // R20 yoy markazi P (O\u2084): O\u2081 dan R10+R20, O\u2082 dan R18+R20 masofada\n  var ra = r10 + R20, rb = r18 + R20;\n  var dd = Math.hypot(O2[0] - O1[0], O2[1] - O1[1]);\n  var ux = (O2[0] - O1[0]) / dd, uy = (O2[1] - O1[1]) / dd;\n  var xo = (ra * ra - rb * rb + dd * dd) / (2 * dd), ho = Math.sqrt(ra * ra - xo * xo);\n  var PP = [O1[0] + xo * ux + ho * uy, O1[1] + xo * uy - ho * ux];\n  var PA = [O1[0] + r10 * (PP[0] - O1[0]) / ra, O1[1] + r10 * (PP[1] - O1[1]) / ra];\n  var PB = [O2[0] + r18 * (PP[0] - O2[0]) / rb, O2[1] + r18 * (PP[1] - O2[1]) / rb];\n  var phi1 = ang(O1, PP), phi2 = ang(O2, PP);\n  var aA = ang(PP, PA), aB = ang(PP, PB), sweepAB = angDiff(aA, aB);\n\n  // R7 yumaloqlash markazi F (O\u2083)\n  var FF = [X(-3), Y(19)];\n\n  /* ---------- sirkul holati ---------- */\n  function mk(n, phi, r, off, tip) { return { n: n, phi: phi, r: r, hang: phi + off, tip: tip }; }\n  function chooseOff(a0, a1) { var ph = (a0 + a1) / 2; return Math.sin((ph - 90) * D2R) <= 0 ? -90 : 90; }\n  function lerpPose(a, b, e) {\n    return {\n      n: [a.n[0] + (b.n[0] - a.n[0]) * e, a.n[1] + (b.n[1] - a.n[1]) * e],\n      r: a.r + (b.r - a.r) * e,\n      phi: a.phi + angDiff(a.phi, b.phi) * e,\n      hang: a.hang + angDiff(a.hang, b.hang) * e,\n      tip: b.tip\n    };\n  }\n\n  /* ---------- bosqichlar ---------- */\n  var stages = [], labels = [], poseCur = null;\n  // deg: o'lcham chizig'i burchagi; ext: polka boshlanadigan nuqtaning markazdan uzoqligi (mm)\n  function diamObj(c, r, deg, text, ext) {\n    return { kind: 'diam', c: c, r: r, dx: Math.cos(deg * D2R), dy: Math.sin(deg * D2R), text: text, ext: ext * SC };\n  }\n  // vaqtinchalik o'lcham: chiziladi, biroz turadi, so'ng so'nadi\n  // yordamchi yoy radiusi (darslikdagidek): markazdan yoygacha strelka, polka ustida R(10+20)\n  function auxRad(c, r, deg, txt, ext, side, lbl) {\n    var o = diamObj(c, r, deg, txt, ext); o.rad = true; o.side = side;\n    o.dur = 1100; o.step = 4; o.hold = true; o.label = lbl;\n    add(o);\n  }\n  function note(items, dur, step, lbl) { add({ kind: 'note', dur: dur, items: items, step: step, label: lbl }); }\n  var ENTRY = { n: [830, 650], phi: -120, r: r10, hang: -210, tip: 'circle' };\n  function add(s) { if (s.kind === 'line') s.dur = Math.round(s.dur * 1.6); s.pose = poseCur; stages.push(s); return stages.length - 1; }\n  function label(text, x, y, at, align) { labels.push({ text: text, x: x, y: y, at: at, align: align || 'center' }); }\n  var q;\n\n  add({ kind: 'rest', dur: 400, step: 0, label: 'Chizish uchun tayyor' });\n\n  // 1. simmetriya o'qlari\n  add({ kind: 'line', dur: 1000, a: [O1[0] - r10 - 15, O1[1]], b: [O1[0] + r10 + 15, O1[1]], style: 'axis', step: 0, label: 'O\u2081 markazning gorizontal o\\'qi' });\n  q = add({ kind: 'line', dur: 700, a: [O1[0], O1[1] - r10 - 15], b: [O1[0], O1[1] + r10 + 15], style: 'axis', step: 0, label: 'O\u2081 markazning vertikal o\\'qi' });\n  label('O\u2081', O1[0] + 9, O1[1] + 60, q, 'left');\n  add({ kind: 'line', dur: 1000, a: [O2[0] - r18 - 15, O2[1]], b: [O2[0] + r18 + 15, O2[1]], style: 'axis', step: 0, label: 'O\u2082 markazning gorizontal o\\'qi (O\u2081 dan 8 mm balandda)' });\n  q = add({ kind: 'line', dur: 700, a: [O2[0], O2[1] - r18 - 15], b: [O2[0], O2[1] + r18 + 15], style: 'axis', step: 0, label: 'O\u2082 markazning vertikal o\\'qi (O\u2081 dan 40 mm o\\'ngda)' });\n  label('O\u2082', O2[0] - 12, O2[1] + 28, q, 'right');\n  // vaqtinchalik: markazlar orasidagi masofalar\n  note([\n    { kind: 'lin', x1: O1[0], x2: O2[0], y: 505, ys: 445, ye: 520, text: '40' },\n    { kind: 'vlin', x: 752, y1: O1[1], y2: O2[1], xs1: O1[0] + r10 + 25, xs2: O2[0] + r18 + 25, xe: 764, text: '8' }\n  ], 2800, 0, 'O\\'lcham: O\u2082 markaz O\u2081 dan 40 mm o\\'ngda va 8 mm balandda');\n\n  // 2. aylanalar\n  function circ(c, r, rn, dn, tag, d) {\n    var to = mk(c, 0, r, -90, 'circle');\n    add({ kind: 'move', dur: 700, from: poseCur || ENTRY, to: to, step: 1, label: 'Sirkulni ' + rn + ' ga ochamiz (\u00d8' + dn + '), igna ' + tag + ' nuqtada' });\n    poseCur = to;\n    add({ kind: 'circle', dur: 1300, c: c, r: r, phi0: 0, step: 1, label: tag + ' markazdan ' + rn + ' radiusli aylana (\u00d8' + dn + ')' });\n    poseCur = mk(c, 360, r, -90, 'circle');\n    note([diamObj(c, r, d[0], '\u00d8' + dn, d[1])], 2200, 1, 'O\\'lcham: \u00d8' + dn + ' (' + rn + ', ' + tag + ' markaz)');\n  }\n  // [burchak, polka masofasi (mm)] \u2014 polkalar detal tashqarisida, bo'sh joyda\n  var DIMS = { d10: [120, 15.8], d20: [50, 15.8], d22: [-35, 22], d36: [62, 22.5] };\n  circ(O1, r5, 'R5', 10, 'O\u2081', DIMS.d10);\n  circ(O1, r10, 'R10', 20, 'O\u2081', DIMS.d20);\n  circ(O2, r11, 'R11', 22, 'O\u2082', DIMS.d22);\n  circ(O2, r18, 'R18', 36, 'O\u2082', DIMS.d36);\n\n  // 3. urinma chiziqlar\n  add({ kind: 'line', dur: 1000, a: [O1[0], Y(-10)], b: [O2[0], Y(-10)], style: 'main', step: 2, label: 'Ikkala aylananing pastki tomoniga gorizontal urinma' });\n  add({ kind: 'line', dur: 700, a: [X(-10), O1[1]], b: [X(-10), FF[1]], style: 'main', step: 2, label: '\u00d820 aylananing chap tomoniga vertikal urinma' });\n  add({ kind: 'line', dur: 1100, a: [O2[0], Y(26)], b: [FF[0], Y(26)], style: 'main', step: 2, label: '\u00d836 aylananing yuqori tomoniga gorizontal urinma' });\n\n  // 4. R7 yumaloqlash\n  add({ kind: 'line', dur: 600, a: [FF[0], 100], b: [FF[0], 205], style: 'aux', step: 3, label: 'Chap chiziqdan 7 mm ichkarida parallel yordamchi chiziq' });\n  add({ kind: 'line', dur: 600, a: [40, FF[1]], b: [190, FF[1]], style: 'aux', step: 3, label: 'Yuqori chiziqdan 7 mm pastda parallel yordamchi chiziq' });\n  q = add({ kind: 'point', dur: 400, p: FF, text: 'O\u2083', lo: [18, -16], step: 3, label: 'Chiziqlar kesishgan nuqta O\u2083 yoy markazi bo\\'ladi' });\n  var f0 = 180, f1 = 270, offF = chooseOff(f0, f1);\n  var toF = mk(FF, f0, R7, offF, 'arc');\n  add({ kind: 'move', dur: 800, from: poseCur, to: toF, step: 3, label: 'Sirkulni R7 ga ochamiz, igna O\u2083 nuqtada' });\n  poseCur = toF;\n  add({ kind: 'arc', dur: 1000, c: FF, r: R7, a0: f0, a1: f1, color: 'arc', off: offF, step: 3, label: 'O\u2083 markazdan R7 radiusli yumaloqlash yoyi' });\n  poseCur = mk(FF, f1, R7, offF, 'arc');\n  var Q7 = [FF[0] + R7 * Math.cos(225 * D2R), FF[1] + R7 * Math.sin(225 * D2R)];\n  var R7DIM = diamObj(FF, R7, 240, 'R7', 11.5); R7DIM.rad = true;\n  note([R7DIM], 2000, 3, 'O\\'lcham: R7 yumaloqlash');\n\n  // 5. R20 tashqi tutashtirish\n  var s1a = phi1 - 14, s1b = phi1 + 14, off1 = chooseOff(s1a, s1b);\n  var to5 = mk(O1, s1a, ra, off1, 'aux');\n  add({ kind: 'move', dur: 800, from: poseCur, to: to5, step: 4, label: 'Sirkulni R10+R20 = 30 mm ga ochamiz, igna O\u2081 nuqtada' });\n  poseCur = to5;\n  add({ kind: 'arc', dur: 900, c: O1, r: ra, a0: s1a, a1: s1b, color: 'aux', off: off1, step: 4, label: 'O\u2081 markazdan R10+R20 radiusli yordamchi yoy' });\n  poseCur = mk(O1, s1b, ra, off1, 'aux');\n  auxRad(O1, ra, phi1 - 19 < s1a ? s1a + 3 : phi1 - 19, 'R(10+20)', 32.5, -1, 'O\u2081 markazdan yordamchi yoy radiusi: R10 + R20 = 30 mm');\n  var s2a = phi2 - 12, s2b = phi2 + 16, off2 = chooseOff(s2a, s2b);\n  var to5b = mk(O2, s2a, rb, off2, 'aux');\n  add({ kind: 'move', dur: 700, from: poseCur, to: to5b, step: 4, label: 'Sirkulni R18+R20 = 38 mm ga ochamiz, igna O\u2082 nuqtada' });\n  poseCur = to5b;\n  add({ kind: 'arc', dur: 800, c: O2, r: rb, a0: s2a, a1: s2b, color: 'aux', off: off2, step: 4, label: 'O\u2082 markazdan R18+R20 radiusli yordamchi yoy' });\n  poseCur = mk(O2, s2b, rb, off2, 'aux');\n  auxRad(O2, rb, s2b - 3, 'R(18+20)', 42, 1, 'O\u2082 markazdan yordamchi yoy radiusi: R18 + R20 = 38 mm');\n  add({ kind: 'point', dur: 400, p: PP, text: 'O\u2084', lo: [0, -18], step: 4, label: 'Yoylar kesishgan nuqta O\u2084 belgilanadi' });\n  add({ kind: 'line', dur: 700, a: O1, b: PP, style: 'aux', step: 4, label: 'O\u2081 va O\u2084 ni to\\'g\\'ri chiziq bilan tutashtiramiz' });\n  add({ kind: 'line', dur: 700, a: O2, b: PP, style: 'aux', step: 4, label: 'O\u2082 va O\u2084 ni to\\'g\\'ri chiziq bilan tutashtiramiz' });\n  add({ kind: 'point', dur: 400, p: PA, text: 'A', lo: [-16, -10], step: 4, label: 'A tutashish nuqtasi (O\u2081O\u2084 chizig\\'i va \u00d820 aylana)' });\n  add({ kind: 'point', dur: 400, p: PB, text: 'B', lo: [16, -14], step: 4, label: 'B tutashish nuqtasi (O\u2082O\u2084 chizig\\'i va \u00d836 aylana)' });\n  var offAB = chooseOff(aA, aA + sweepAB);\n  var to5c = mk(PP, aA, R20, offAB, 'arc');\n  add({ kind: 'move', dur: 800, from: poseCur, to: to5c, step: 4, label: 'Sirkulni R20 ga ochamiz, igna O\u2084 nuqtada, qalam A da' });\n  poseCur = to5c;\n  add({ kind: 'arc', dur: 1500, c: PP, r: R20, a0: aA, a1: aA + sweepAB, color: 'arc', off: offAB, step: 4, label: 'O\u2084 markazdan R20 radiusli yoy A dan B gacha' });\n  poseCur = mk(PP, aA + sweepAB, R20, offAB, 'arc');\n  var Q20 = [PP[0] + R20 * Math.cos(75 * D2R), PP[1] + R20 * Math.sin(75 * D2R)];\n  var R20DIM = diamObj(PP, R20, 80, 'R20', 25); R20DIM.rad = true;\n  note([R20DIM], 2000, 4, 'O\\'lcham: R20 tashqi tutashtirish');\n  add({ kind: 'away', dur: 700, from: poseCur, to: ENTRY, step: 4, label: 'Sirkul chetga olinadi' });\n  poseCur = null;\n\n  // 6. o'lchamlar\n  function diam(c, r, d, text) {\n    var o = diamObj(c, r, d[0], text, d[1]);\n    o.dur = 900; o.step = 5; o.label = text + ' diametr o\\'lchami (yakuniy)';\n    add(o);\n  }\n  diam(O1, r5, DIMS.d10, '\u00d810');\n  diam(O1, r10, DIMS.d20, '\u00d820');\n  diam(O2, r11, DIMS.d22, '\u00d822');\n  diam(O2, r18, DIMS.d36, '\u00d836');\n  add(Object.assign({}, R7DIM, { dur: 800, step: 5, label: 'R7 radius o\\'lchami (yakuniy)' }));\n  add(Object.assign({}, R20DIM, { dur: 900, step: 5, label: 'R20 radius o\\'lchami (yakuniy)' }));\n  add({ kind: 'lin', dur: 1000, x1: O1[0], x2: O2[0 if (S.ruler && s.kind === 'line' && p > 0 && p < 1) drawRuler(s, p);\n    if (pencilTip) drawPencil(pencilTip);\n\n    var pose = null;\n    if (s.kind === 'move' || s.kind === 'away') pose = lerpPose(s.from, s.to, ease(p));\n    else if (s.kind === 'circle') pose = mk(s.c, s.phi0 + 360 * p, s.r, -90, 'circle');\n    else if (s.kind === 'arc') pose = mk(s.c, s.a0 + (s.a1 - s.a0) * p, s.r, s.off, s.color);\n    else if ((s.kind === 'note' && S.notes) || s.hold) pose = null;   // o'lcham ko'rinishi uchun sirkul yashiriladi\n    else pose = s.pose;\n\n    if (pose && S.compass) drawCompass(pose);\n\n    var sp = '';\n    if (pose) {\n      for (var qq = 0; qq < SPREADS.length; qq++) if (Math.abs(pose.r - SPREADS[qq][0]) < 0.6) sp = 'Sirkul ochilishi: ' + SPREADS[qq][1];\n    }\n    var lblTxt = s.label;\n    if (!playing && ((s.kind === 'note' && S.notes && p > 0 && p < 1) || (s.hold && p > 0.9))) lblTxt += ' \u2014 davom etish uchun \u00abDavom etish\u00bb ni bosing';\n    if (lblTxt !== lastLabel) { $('stageLabel').textContent = lblTxt; lastLabel = lblTxt; }\n    if (sp !== lastSpread) { $('spread').textContent = sp; lastSpread = sp; }\n    if (s.step !== curStep) { curStep = s.step; renderSteps(); }\n  }\n\n  function resize() {\n    var r = sheet.getBoundingClientRect();\n    var w = Math.max(240, Math.round(r.width));\n    var dpr = Math.min(window.devicePixelRatio || 1, 2.5);\n    cv.width = Math.round(w * dpr);\n    cv.height = Math.round(w * dpr * H / W);\n    dirty = true;\n  }\n\n  /* ---------- qadamlar ro'yxati ---------- */\n  function renderSteps() {\n    var ol = $('steps');\n    ol.innerHTML = '';\n    STEPS.forEach(function (st, k) {\n      var li = document.createElement('li');\n      var b = document.createElement('button');\n      b.type = 'button'; b.className = 'step';\n      if (k === curStep) b.setAttribute('aria-current', 'step');\n      var html = '<span class=\"num\">' + (k + 1) + '<\/span><span class=\"ttl\">' + st.t + '<\/span>';\n      if (k === curStep) html += '<p class=\"desc\">' + st.d + '<\/p>';\n      b.innerHTML = html;\n      b.addEventListener('click', function () { t = stepStarts[k]; setPlaying(true); dirty = true; });\n      li.appendChild(b); ol.appendChild(li);\n    });\n  }\n\n  /* ---------- boshqaruv ---------- */\n  function updatePlay() {\n    var b = $('play');\n    if (playing) b.textContent = 'To\\'xtatish';\n    else if (t >= total || t <= 0) b.textContent = 'Boshlash';\n    else b.textContent = 'Davom etish';\n  }\n  function setPlaying(v) { playing = v; last = performance.now(); updatePlay(); }\n  function updateScrub() { $('scrub').value = Math.round(t / total * 1000); }\n\n  function applyUI() {\n    $('speed').value = S.speed; $('speedOut').textContent = (Math.round(S.speed * 100) / 100) + '\u00d7';\n    $('circleColor').value = S.circleColor; $('auxColor').value = S.auxColor;\n    $('arcColor').value = S.arcColor; $('bg').value = S.bg;\n    $('circleW').value = S.circleW; $('circleWOut').textContent = S.circleW.toFixed(1);\n    $('auxW').value = S.auxW; $('auxWOut').textContent = S.auxW.toFixed(1);\n    $('arcW').value = S.arcW; $('arcWOut').textContent = S.arcW.toFixed(1);\n    $('compass').checked = S.compass; $('ruler').checked = S.ruler; $('loop').checked = S.loop; $('notes').checked = S.notes; $('pause').checked = S.pause; $('pause').disabled = !S.notes;\n    var chips = $('speedChips').children;\n    for (var i = 0; i < chips.length; i++) chips[i].setAttribute('aria-pressed', String(parseFloat(chips[i].getAttribute('data-speed')) === S.speed));\n    dirty = true;\n  }\n  function change() { applyUI(); save(); }\n\n  $('play').addEventListener('click', function () {\n    if (playing) { setPlaying(false); return; }\n    if (t >= total) t = 0;\n    setPlaying(true); dirty = true;\n  });\n  $('restart').addEventListener('click', function () { t = 0; setPlaying(true); dirty = true; });\n  $('next').addEventListener('click', function () {\n    setPlaying(false);\n    var target = total;\n    for (var i = 0; i < stepEnds.length; i++) { if (stepEnds[i] > t + 5) { target = stepEnds[i]; break; } }\n    t = Math.min(target, total); dirty = true; updatePlay(); updateScrub();\n  });\n  $('prev').addEventListener('click', function () {\n    setPlaying(false);\n    var target = 0;\n    for (var i = stepEnds.length - 1; i >= 0; i--) { if (stepEnds[i] < t - 5) { target = stepEnds[i]; break; } }\n    t = target; dirty = true; updatePlay(); updateScrub();\n  });\n  $('scrub').addEventListener('input', function (e) {\n    setPlaying(false);\n    t = parseFloat(e.target.value) / 1000 * total; dirty = true; updatePlay();\n  });\n\n  $('speed').addEventListener('input', function (e) { S.speed = parseFloat(e.target.value); change(); });\n  $('speedChips').addEventListener('click', function (e) {\n    var v = e.target.getAttribute && e.target.getAttribute('data-speed');\n    if (v) { S.speed = parseFloat(v); change(); }\n  });\n  $('circleColor').addEventListener('input', function (e) { S.circleColor = e.target.value; change(); });\n  $('auxColor').addEventListener('input', function (e) { S.auxColor = e.target.value; change(); });\n  $('arcColor').addEventListener('input', function (e) { S.arcColor = e.target.value; change(); });\n  $('bg').addEventListener('input', function (e) { S.bg = e.target.value; change(); });\n  $('circleW').addEventListener('input', function (e) { S.circleW = parseFloat(e.target.value); change(); });\n  $('auxW').addEventListener('input', function (e) { S.auxW = parseFloat(e.target.value); change(); });\n  $('arcW').addEventListener('input', function (e) { S.arcW = parseFloat(e.target.value); change(); });\n  $('compass').addEventListener('change', function (e) { S.compass = e.target.checked; change(); });\n  $('ruler').addEventListener('change', function (e) { S.ruler = e.target.checked; change(); });\n  $('loop').addEventListener('change', function (e) { S.loop = e.target.checked; change(); });\n  $('notes').addEventListener('change', function (e) { S.notes = e.target.checked; change(); });\n  $('pause').addEventListener('change', function (e) { S.pause = e.target.checked; change(); });\n  $('reset').addEventListener('click', function () {\n    for (var k in DEFAULTS) S[k] = DEFAULTS[k];\n    change();\n  });\n\n  PRESETS.forEach(function (pr) {\n    var b = document.createElement('button');\n    b.type = 'button';\n    b.innerHTML = '<span class=\"dots\"><i style=\"background:' + pr.bg + '\"><\/i><i style=\"background:' + pr.circleColor + '\"><\/i><i style=\"background:' + pr.auxColor + '\"><\/i><i style=\"background:' + pr.arcColor + '\"><\/i><\/span><span>' + pr.name + '<\/span>';\n    b.addEventListener('click', function () {\n      S.circleColor = pr.circleColor; S.auxColor = pr.auxColor; S.arcColor = pr.arcColor; S.bg = pr.bg; change();\n    });\n    $('presets').appendChild(b);\n  });\n\n  /* ---------- animatsiya sikli ---------- */\n  function tick(ts) {\n    if (playing) {\n      var dt = Math.min(64, ts - last);\n      last = ts;\n      var tOld = t;\n      t += dt * S.speed;\n      // o'lcham to'liq chizilgan joyda to'xtash\n      if (S.notes && S.pause) {\n        for (var pi = 0; pi < pausePts.length; pi++) {\n          if (tOld < pausePts[pi] && t >= pausePts[pi]) { t = pausePts[pi]; playing = false; updatePlay(); break; }\n        }\n      }\n      if (t >= total) {\n        if (S.loop) t = 0; else { t = total; playing = false; updatePlay(); }\n      }\n      dirty = true;\n    }\n    if (dirty) { draw(); updateScrub(); dirty = false; }\n    requestAnimationFrame(tick);\n  }\n\n  if (window.ResizeObserver) new ResizeObserver(function () { requestAnimationFrame(resize); }).observe(sheet);\n  window.addEventListener('resize', resize);\n  applyUI(); updatePlay(); resize();\n  requestAnimationFrame(tick);\n})();\n<\/script>\n\n<\/body>\n<\/html>\n"};

/* ============ bosqichli animatsiya vidjeti ============ */
function Stepper(host,modes,opt){
  opt=opt||{};var self=this;this.modes=modes;this.mode=modes[0];this.params={};this.k=0;this.timer=null;
  host.innerHTML='<div class="stepper"><div class="bar"><div class="modes"></div></div><div class="body"><div class="canvas"></div><div class="info"><div class="stepno"></div><div class="dots"></div><div class="ttl"></div><div class="desc"></div><div class="sliders"></div><div class="ctrl"><button class="btn" data-a="prev">‹ Oldingi</button><button class="btn primary" data-a="play">▶ Avto</button><button class="btn" data-a="next">Keyingi ›</button><button class="btn" data-a="restart">↺ Boshidan</button><button class="btn" data-a="all">Hammasi</button></div></div></div></div>';
  this.el=host.firstChild;
  var mb=$(".modes",this.el);
  if(modes.length>1)modes.forEach(function(m){var bt=document.createElement("button");bt.textContent=CONS[m].name;bt.onclick=function(){self.setMode(m)};bt.dataset.m=m;mb.appendChild(bt)});
  else $(".bar",this.el).style.display="none";
  $(".ctrl",this.el).onclick=function(e){var a=e.target.dataset.a;if(!a)return;
    if(a==="next")self.go(self.k+1,true);if(a==="prev")self.go(self.k-1,false);if(a==="restart"){self.stop();self.go(0,true)}
    if(a==="all"){self.stop();self.go(self.b.steps.length-1,false)}if(a==="play")self.toggle()};
  this.setMode(this.mode);
}
Stepper.prototype.setMode=function(m){
  this.stop();this.mode=m;var c=CONS[m],self=this,sl=$(".sliders",this.el);sl.innerHTML="";this.params={};
  $$(".modes button",this.el).forEach(function(b){b.setAttribute("aria-pressed",b.dataset.m===m)});
  if(c.params)Object.keys(c.params).forEach(function(k){var p=c.params[k];self.params[k]=p.val;
    var d=document.createElement("label");d.className="sl";d.innerHTML='<span>'+p.label+': <b>'+p.val+'</b></span><input type="range" min="'+p.min+'" max="'+p.max+'" value="'+p.val+'">';
    var inp=$("input",d);inp.oninput=function(){self.params[k]=+inp.value;$("b",d).textContent=inp.value;self.render(false)};sl.appendChild(d)});
  this.k=0;this.render(true);
};
Stepper.prototype.render=function(anim){
  this.b=CONS[this.mode].build(this.params);if(this.k>this.b.steps.length-1)this.k=this.b.steps.length-1;
  $(".canvas",this.el).innerHTML=svgOf(this.b);this.show(anim);
};
Stepper.prototype.show=function(anim){
  var k=this.k,self=this,steps=this.b.steps;
  $$("[data-s]",this.el).forEach(function(n){var s=+n.dataset.s,it=self.b.items[+n.dataset.i];
    n.classList.toggle("hid",s>k);n.classList.remove("draw","pop");n.style.strokeDasharray="";n.style.strokeDashoffset="";n.removeAttribute("pathLength");
    n.classList.toggle("faded",it.fade!==undefined&&k>=it.fade);
    if(anim&&s===k){void n.getBBox;if(n.tagName==="path"){n.setAttribute("pathLength","1");n.style.strokeDasharray="1";n.style.strokeDashoffset="1";n.classList.add("draw");
        n.addEventListener("animationend",function h(){n.removeAttribute("pathLength");n.style.strokeDasharray="";n.style.strokeDashoffset="";n.classList.remove("draw");n.removeEventListener("animationend",h)})}
      else n.classList.add("pop")}});
  $(".stepno",this.el).textContent=(k+1)+"-qadam / "+steps.length;
  $(".ttl",this.el).textContent=steps[k].t;$(".desc",this.el).textContent=steps[k].d;
  var dots="";for(var i=0;i<steps.length;i++)dots+='<i class="'+(i<=k?"on":"")+'"></i>';$(".dots",this.el).innerHTML=dots;
};
Stepper.prototype.go=function(k,anim){k=Math.max(0,Math.min(this.b.steps.length-1,k));this.k=k;this.show(anim)};
Stepper.prototype.toggle=function(){var self=this,bt=$('[data-a="play"]',this.el);
  if(this.timer){this.stop();return}
  if(this.k>=this.b.steps.length-1)this.go(0,true);
  bt.textContent="⏸ To'xtat";this.timer=setInterval(function(){if(self.k>=self.b.steps.length-1){self.stop();return}self.go(self.k+1,true)},2600)};
Stepper.prototype.stop=function(){clearInterval(this.timer);this.timer=null;var bt=this.el&&$('[data-a="play"]',this.el);if(bt)bt.textContent="▶ Avto"};

function arcPts(c,r,a0,a1,n){var o=[];n=n||Math.max(6,Math.ceil(Math.abs(a1-a0)/6));for(var i=0;i<=n;i++){var a=(a0+(a1-a0)*i/n)*D2R;o.push([c[0]+r*Math.cos(a),c[1]+r*Math.sin(a)])}return o}

  for(var i=0;i<n;i++){var P=V[(i-1+n)%n],C=V[i],N=V[(i+1)%n],r=Rs[i]||0;
    if(!r){out.push(C);continue}
    var u1=nrm(sub(P,C)),u2=nrm(sub(N,C)),cos=u1[0]*u2[0]+u1[1]*u2[1],half=Math.acos(Math.max(-1,Math.min(1,cos)))/2;
    var t=r/Math.tan(half),T1=add(C,mul(u1,t)),T2=add(C,mul(u2,t)),O=add(C,mul(nrm(add(u1,u2)),r/Math.sin(half)));
    var a0=Math.atan2(T1[1]-O[1],T1[0]-O[0])/D2R,a1=a0+dnorm(Math.atan2(T2[1]-O[1],T2[0]-O[0])/D2R-a0);
    out=out.concat(arcPts(O,r,a0,a1));out[out.length-1].fil={O:O,r:r};}

}
var PARTS={
  kalibr:{name:"Kalibr (10.4-chizma asosida)",T:12,build:function(){
    var V=[[-40,0],[-15,0],[-15,7],[-25,7],[-30,60],[30,60],[25,7],[15,7],[15,0],[40,0],[40,70],[-40,70]];

  quloq:{name:"Chelak qulog'i (11.2-chizma)",T:10,build:function(){
    var yc=Math.sqrt(35*35-25*25),Fu=[25,yc],Fd=[25,-yc],Tu=mul(Fu,25/35),Td=mul(Fd,25/35);
    var a=Math.atan2(Tu[1],Tu[0])/D2R,o=[];
    o=o.concat(arcPts([0,0],25,a,360-a,60));
    o=o.concat(arcPts(Fd,10,180+a,360,12));

    o=o.concat(arcPts(Fu,10,0,-180-a+360-360,12).map(function(p){return p}));

// tekshiruv: quloq yuqori fillet yoyi 0° dan (180+a)-360 ga, ya'ni soat strelkasi bo'yicha
PARTS.quloq.build=(function(){return function(){
  var yc=Math.sqrt(35*35-25*25),Fu=[25,yc],Fd=[25,-yc],Tu=mul(Fu,25/35);
  var a=Math.atan2(Tu[1],Tu[0])/D2R,o=[];

/* ============ 3D ko'ruvchi (siqib chiqarilgan detal) ============ */
function Viewer(host,partKey){
  var part=PARTS[partKey],g=part.build(),T=part.T,self=this;
  host.innerHTML='<div class="viewer"><canvas width="900" height="675" aria-label="Detalning aylantiriladigan 3D modeli"></canvas><div><h4 style="margin-top:0">'+part.name+'</h4><p style="font-size:14px;color:var(--muted);margin:0 0 10px">Sichqoncha yoki barmoq bilan torting: model aylanadi. G\'ildirakcha bilan yaqinlashtiring.</p><div style="display:grid;gap:6px"><button class="btn" data-v="iso">Izometriya</button><button class="btn" data-v="front">Oldidan ko\'rinish</button><button class="btn" data-v="top">Ustidan ko\'rinish</button><button class="btn" data-v="spin" aria-pressed="true">⟳ Avto aylantirish</button><label style="font-size:14px;display:flex;gap:8px;align-items:center;margin-top:6px"><input type="checkbox" data-v="edges" checked> Qirralarni ko\'rsatish</label></div></div></div>';
  var cv=$("canvas",host),ctx=cv.getContext("2d");
  var xs=g.outer.map(function(p){return p[0]}),ys=g.outer.map(function(p){return p[1]});
  var cx=(Math.min.apply(0,xs)+Math.max.apply(0,xs))/2,cy=(Math.min.apply(0,ys)+Math.max.apply(0,ys))/2;
  var span=Math.max(Math.max.apply(0,xs)-Math.min.apply(0,xs),Math.max.apply(0,ys)-Math.min.apply(0,ys));
  var outer=g.outer.map(function(p){return[p[0]-cx,p[1]-cy]});
  var holes=g.holes.map(function(h){return arcPts([h.c[0]-cx,h.c[1]-cy],h.r,0,360,Math.max(16,Math.round(h.r*3))).slice(0,-1)});
  var yaw=-35,pitch=28,zoom=1,spin=true,edges=true,drag=null;
  function rot(p){var a=yaw*D2R,b=pitch*D2R;var x=p[0]*Math.cos(a)+p[2]*Math.sin(a),z=-p[0]*Math.sin(a)+p[2]*Math.cos(a),y=p[1];
    var y2=y*Math.cos(b)-z*Math.sin(b),z2=y*Math.sin(b)+z*Math.cos(b);return[x,y2,z2]}
  function proj(q){var k=cv.width*0.62/span*zoom,f=span*4,s=f/(f-q[2]);return[cv.width/2+q[0]*k*s,cv.height/2-q[1]*k*s]}
  var L=nrm3([-0.4,0.6,0.7]);
  function nrm3(v){var l=Math.hypot(v[0],v[1],v[2]);return[v[0]/l,v[1]/l,v[2]/l]}
  function shade(n,base){var d=Math.max(0,n[0]*L[0]+n[1]*L[1]+n[2]*L[2]),k=0.38+0.62*d;return"rgb("+Math.round(base[0]*k)+","+Math.round(base[1]*k)+","+Math.round(base[2]*k)+")"}
  function draw(){
    ctx.clearRect(0,0,cv.width,cv.height);
    var zf=T/2,zb=-T/2,quads=[];
    function walls(poly,inward){for(var i=0;i<poly.length;i++){var a=poly[i],b=poly[(i+1)%poly.length];
      var nx=b[1]-a[1],ny=-(b[0]-a[0]);if(inward){nx=-nx;ny=-ny}var l=Math.hypot(nx,ny)||1;
      var P=[[a[0],a[1],zf],[b[0],b[1],zf],[b[0],b[1],zb],[a[0],a[1],zb]].map(rot),n=rot([nx/l,ny/l,0]);
      if(n[2]<=0.0001)continue;quads.push({P:P,n:n,z:(P[0][2]+P[1][2]+P[2][2]+P[3][2])/4})}}
    walls(outer,false);holes.forEach(function(h){walls(h,true)});
    var nf=rot([0,0,1]),front=nf[2]>0;
    function cap(z,n,fill){ctx.beginPath();[outer].concat(holes).forEach(function(poly){poly.forEach(function(p,i){var s=proj(rot([p[0],p[1],z]));i?ctx.lineTo(s[0],s[1]):ctx.moveTo(s[0],s[1])});ctx.closePath()});
      ctx.fillStyle=shade(n,[150,178,214]);ctx.fill("evenodd");if(edges){ctx.strokeStyle="#21324a";ctx.lineWidth=1.6;ctx.stroke()}}
    cap(front?zb:zf,rot([0,0,front?-1:1]));
    quads.sort(function(a,b){return a.z-b.z});
    quads.forEach(function(q){var s=q.P.map(proj);ctx.beginPath();ctx.moveTo(s[0][0],s[0][1]);for(var i=1;i<4;i++)ctx.lineTo(s[i][0],s[i][1]);ctx.closePath();
      var c=shade(q.n,[150,178,214]);ctx.fillStyle=c;ctx.strokeStyle=c;ctx.lineWidth=1;ctx.fill();ctx.stroke()});
    cap(front?zf:zb,rot([0,0,front?1:-1]));
  }
  function loop(){if(spin&&!drag)yaw+=0.35;draw();self.raf=requestAnimationFrame(loop)}
  cv.addEventListener("pointerdown",function(e){drag=[e.clientX,e.clientY,yaw,pitch];cv.setPointerCapture(e.pointerId);cv.style.cursor="grabbing"});
  cv.addEventListener("pointermove",function(e){if(!drag)return;yaw=drag[2]+(e.clientX-drag[0])*0.5;pitch=Math.max(-89,Math.min(89,drag[3]+(e.clientY-drag[1])*0.5))});
  cv.addEventListener("pointerup",function(){drag=null;cv.style.cursor="grab"});
  cv.addEventListener("wheel",function(e){e.preventDefault();zoom=Math.max(0.5,Math.min(2.4,zoom*(e.deltaY<0?1.08:0.93)))},{passive:false});
  host.addEventListener("click",function(e){var v=e.target.dataset&&e.target.dataset.v;if(!v)return;
    if(v==="iso"){yaw=-35;pitch=28}if(v==="front"){yaw=0;pitch=0;spin=false}if(v==="top"){yaw=0;pitch=89;spin=false}
    if(v==="spin")spin=!spin;if(v==="edges")edges=e.target.checked;
    var sb=$('[data-v="spin"]',host);sb.setAttribute("aria-pressed",spin)});
  loop();
}
Viewer.prototype.destroy=function(){cancelAnimationFrame(this.raf)};

function partDrawing(key,k,ox,oy,dims){

  b.poly(g.outer.map(S).concat([S(g.outer[0])]),"main");
  g.holes.forEach(function(h){b.circle(S(h.c),h.r*k,"main");b.axes(S(h.c),h.r*k+10)});
  dims(b,S,k);

}
function hdim(b,S,x1,x2,yf,yd,t){var a=S([x1,yd]),c=S([x2,yd]);b.line(S([x1,yf]),add(a,[0,yd<yf?6:-6]),"dim");b.line(S([x2,yf]),add(c,[0,yd<yf?6:-6]),"dim");b.push({k:"line",a:a,b:c,cl:"dim",arrow:"both"});b.txt(add(mul(add(a,c),.5),[0,-12]),t,"dt")}
function vdim(b,S,y1,y2,xf,xd,t){var a=S([xd,y1]),c=S([xd,y2]);b.line(S([xf,y1]),add(a,[xd<xf?-6:6,0]),"dim");b.line(S([xf,y2]),add(c,[xd<xf?-6:6,0]),"dim");b.push({k:"line",a:a,b:c,cl:"dim",arrow:"both"});b.txt(add(mul(add(a,c),.5),[xd<xf?-16:16,0]),t,"dt")}
function leader(b,p,q,t){b.push({k:"line",a:q,b:p,cl:"dim",arrow:"end"});var w=t.length*9+10,dir=q[0]<p[0]?-1:1;b.line(q,add(q,[dir*w,0]),"dim");b.txt(add(q,[dir*w/2,-10]),t,"dt")}

  title:"11-§. Ikki aylanani uchinchi aylana yordamida tutashtirish",

  part:"quloq",
  theory:function(){return `
<p>Texnikada ishlatiladigan <b>gayka kalitining</b> qo'lda ushlanadigan sopi va kallagi yoylar bilan silliq tutashtirilgan. Har qanday chiroyli buyum sirtida turli yoylarni ko'rish mumkin: ular to'g'ri chiziq bilan yoki qavariq va botiq yoylar bilan tutashtirilgan bo'ladi.</p>
<h3>1. Aylana va to'g'ri chiziqni tutashtirish</h3>
<ol><li>To'g'ri chiziqqa tutashtirish radiusi <i>R</i> masofada parallel yordamchi chiziq o'tkaziladi.</li>
<li>Aylana radiusi R₁ ga R qo'shiladi. O₁ markazdan <b>R₁ + R</b> radiusda yordamchi yoy chizilib, parallel chiziq bilan kesishtiriladi. Natijada <i>O</i> markaz hosil bo'ladi.</li>
<li><i>O</i> dan to'g'ri chiziqqa perpendikulyar tushirilsa, <i>A</i> o'tish nuqtasi topiladi. <i>O</i> bilan O₁ tutashtirilsa, aylanadagi <i>B</i> nuqta topiladi.</li>
<li><i>O</i> markazdan <i>A</i> va <i>B</i> orqali yoy chiziladi.</li></ol>
${staticFig("lineCircle",{R:12},"11.1-chizma. Aylana va to'g'ri chiziqni tutashtirish")}
<h3>2. Aylanaga aylanani urintirish</h3>
<div class="grid2"><div>
<p><b>Tashqi urinish.</b> O₁ markazdan <b>R₁ + R</b> radiusda yoy chizilsa, <i>O</i> markaz topiladi. Bunday aylanalar markazlari orasidagi masofa radiuslari <b>yig'indisiga</b> teng.</p>
${staticFig("tanExt",null,"11.3-chizma, a. Tashqi urinish")}</div><div>
<p><b>Ichki urinish.</b> R₁ dan R ayiriladi. O₁ dan <b>R₁ − R</b> radiusda yoy chizilsa, <i>O</i> markaz topiladi. Markazlar orasidagi masofa radiuslar <b>ayirmasiga</b> teng.</p>
${staticFig("tanInt",null,"11.3-chizma, b. Ichki urinish")}</div></div>
<h3>3. Ikki aylanani uchinchi aylana yoyi bilan tutashtirish</h3>
<p><b>Tashqi tutashtirish.</b> O₁ markazdan <b>R₁ + R</b>, O₂ markazdan <b>R₂ + R</b> radiusda yordamchi yoylar chizilib, kesishtiriladi. Kesishish nuqtasi <i>O</i> tutashtirish markazi bo'ladi. <i>O</i> ni O₁ va O₂ bilan tutashtirsak, aylanalarda <i>A</i> va <i>B</i> o'tish nuqtalari topiladi.</p>
${staticFig("twoExt",{R:60},"11.4-chizma. Ikki aylanani tashqi tutashtirish")}
<p><b>Ichki tutashtirish.</b> Tutashtiruvchi yoy ikkala aylanani o'z ichiga oladi. Yordamchi yoylar <b>R − R₁</b> va <b>R − R₂</b> radiuslarda chiziladi. O'tish nuqtalari <i>O</i>O₁ va <i>O</i>O₂ chiziqlarining davomida topiladi.</p>
${staticFig("twoInt",{R:250},"Ikki aylanani ichki tutashtirish")}
<table><tr><th>Tutashma turi</th><th>O₁ dan yoy radiusi</th><th>O₂ dan yoy radiusi</th><th>O'tish nuqtalari</th></tr>
<tr><td>Tashqi</td><td>R₁ + R</td><td>R₂ + R</td><td>O–O₁ va O–O₂ kesmalarida</td></tr>
<tr><td>Ichki</td><td>R − R₁</td><td>R − R₂</td><td>O–O₁ va O–O₂ davomida</td></tr>
<tr><td>Aralash</td><td>R₁ + R</td><td>R − R₂</td><td>biri kesmada, biri davomida</td></tr></table>
<div class="remember"><b>Eslab qoling:</b><br>• Urinish nuqtasi doimo <b>ikki markazni tutashtiruvchi chiziq</b> ustida (yoki uning davomida) yotadi.<br>• Tashqi tutashmada radiuslar <b>qo'shiladi</b>, ichkisida <b>ayiriladi</b>.<br>• 11.6-chizmada: Ø20 va Ø36 aylanalar R20 yoy bilan tutashtirilganda yordamchi yoylar R(10+20) va R(18+20) bo'ladi.</div>`},

  '<h3>2. Test — 10 savol</h3><table><tr><th>To\'g\'ri javoblar</th><th>Baho</th></tr><tr><td>9–10</td><td>5 (a\'lo)</td></tr><tr><td>7–8</td><td>4 (yaxshi)</td></tr><tr><td>5–6</td><td>3 (qoniqarli)</td></tr><tr><td>0–4</td><td>2 (qoniqarsiz)</td></tr></table>'+
  '<h3>3. Og\'zaki javob (nazorat savollari)</h3><table><tr><th>Baho</th><th>Talab</th></tr>'+
  '<tr><td>5</td><td>Atamalarni to\'g\'ri ishlatadi, yasash tartibini doskada chizib, mustaqil tushuntiradi, hayotiy misol keltiradi.</td></tr>'+
  '<tr><td>4</td><td>Yasashni to\'g\'ri bajaradi, lekin tushuntirishda kichik noaniqliklar bor.</td></tr>'+
  '<tr><td>3</td><td>Ta\'riflarni biladi, yasashni o\'qituvchi yordamida bajaradi.</td></tr>'+
  '<tr><td>2</td><td>Asosiy tushunchalarni bilmaydi.</td></tr></table>'+
  '<h3>4. Krossvord</h3><p>Barcha so\'zlar to\'g\'ri — 5; 1–2 xato — 4; 3–4 xato — 3.</p>'+
  '<div class="remember"><b>Yakuniy baho</b> = grafik ish (40%) + test (30%) + og\'zaki javob (20%) + krossvord / faollik (10%).</div>';
}

/* ============ chizish va boshqaruv ============ */
function renderTopics(){
  $("#topics").innerHTML=Object.keys(TOPICS).map(function(k){return '<button aria-pressed="'+(k===state.topic)+'" data-topic="'+k+'">'+TOPICS[k].tab+'</button>'}).join("");
}
function renderNav(){
  $("#nav").innerHTML=SECS.map(function(s,i){return '<button data-go="'+s.id+'" aria-current="'+(s.id===state.sec)+'"><span class="n">'+(i+1)+'</span><span style="flex:1">'+s.t+'</span>'+(SECSYM[s.id]?symTile(SECSYM[s.id],22):"")+'</button>'}).join("")+
  '<button data-go="metod" aria-current="'+(state.sec==="metod")+'" style="margin-top:6px;border-top:1px dashed var(--line);border-radius:0 0 8px 8px"><span class="n">✎</span><span style="flex:1">O\'qituvchi uchun: metodika</span></button>'+
  '<div class="legend"><h3>Shartli belgilar</h3>'+Object.keys(SYM).map(function(k){return '<div class="row">'+symTile(k,30)+'<div><b>'+SYM[k].t+'</b><small>'+SYM[k].d+'</small></div></div>'}).join("")+'</div>';
  $("#editBtn").setAttribute("aria-pressed",state.edit);$("#editBtn").textContent=state.edit?"✏️ Tahrirlash: yoqiq":"✏️ Tahrirlash";
}
function mount(root){
  live.forEach(function(x){x.destroy&&x.destroy();x.stop&&x.stop()});live=[];
  $$("[data-viewer]",root).forEach(function(h){live.push(new Viewer(h,h.dataset.viewer))});
  $$("[data-stepper]",root).forEach(function(h){live.push(new Stepper(h,TOPICS[state.topic].modes))});
  $$("[data-embed]",root).forEach(loadEmbed);
}
function loadEmbed(h){
  {
    var f=document.createElement("iframe");f.title="Animatsiya";f.style.cssText="width:100%;height:1250px;border:0;display:block";
    f.setAttribute("sandbox","allow-scripts allow-same-origin");f.srcdoc=EMB[h.dataset.embed];h.innerHTML="";h.appendChild(f);
    f.onload=function(){try{var d=f.contentDocument,last=0,pend=false,fit=function(){if(pend)return;pend=true;
        requestAnimationFrame(function(){pend=false;var hh=Math.max(500,d.body.scrollHeight+8);if(Math.abs(hh-last)>4){last=hh;f.style.height=hh+"px"}})};
      fit();setTimeout(fit,600);f.contentWindow.addEventListener("resize",fit)}catch(e){}};
  }
}
function render(all){
  var T=TOPICS[state.topic];
  $("#title").textContent=T.title;$("#subtitle").textContent=T.sub;
  renderTopics();renderNav();
  var m=$("#main");
  if(all){m.innerHTML=SECS.map(function(s){return secHTML(T,s.id)}).join("")}
  else{
    var i=secIdx(state.sec),prev=i>0?SECS[i-1]:null,next=i>=0&&i<SECS.length-1?SECS[i+1]:null;
    if(state.sec==="metod"){prev=null;next=SECS[0]}
    m.innerHTML=secHTML(T,state.sec)+'<div class="pager"><button class="btn" '+(prev?'data-go="'+prev.id+'"':'disabled')+'>‹ '+(prev?prev.t:"")+'</button><button class="btn primary" '+(next?'data-go="'+next.id+'"':'disabled')+'>'+(next?next.t:"")+' ›</button></div>';
  }
  mount(m);
  store.set("topic",state.topic);store.set("secId",state.sec);
  try{if(!all)history.replaceState(null,"","#"+state.topic+"/"+state.sec)}catch(e){}
}
/* ---- tahrirlash ---- */
function cleanBody(sec){
  var c=$(".sec-body",sec).cloneNode(true);
  $$("[data-stepper],[data-viewer],[data-embed]",c).forEach(function(n){n.innerHTML=""});
  $$("[contenteditable]",c).forEach(function(n){if(!n.matches("[data-stepper],[data-viewer],.cw,.qrbox .qr"))n.removeAttribute("contenteditable")});
  return c.innerHTML;
}
function saveEdit(){var sec=$("section.sec");if(!sec)return;var key=state.topic+"/"+sec.dataset.sec;EDITS[key]=cleanBody(sec);var mine=store.get("edits",{});mine[key]=EDITS[key];store.set("edits",mine)}
function resetEdit(){var sec=$("section.sec");if(!sec)return;var key=state.topic+"/"+sec.dataset.sec;delete EDITS[key];var mine=store.get("edits",{});delete mine[key];store.set("edits",mine)}
function exportFile(){
  if(state.edit){saveEdit()}
  var json=JSON.stringify(EDITS).replace(/<\//g,"<\\/");
  var html=SRC.replace(/<script id="ovr">[\s\S]*?<\/script>/,'<script id="ovr">var OVR='+json+';<\/script>');
  var blob=new Blob([html],{type:"text/html"}),a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download="Tutashmalar_qollanma.html";document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);
}
$("#editBtn").onclick=function(){state.edit=!state.edit;render()};
$("#saveFileBtn").onclick=exportFile;
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-esave],[data-ecancel],[data-ereset]");if(!t)return;
  if(t.hasAttribute("data-esave")){saveEdit();state.edit=false;render()}
  else if(t.hasAttribute("data-ecancel")){state.edit=false;render()}
  else if(t.hasAttribute("data-ereset")){if(confirm("Bu bo'limdagi barcha o'zgarishlaringiz o'chadi. Davom etasizmi?")){resetEdit();render()}}
});
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-topic],[data-go],[data-lb],[data-openall],[data-qcheck],[data-qreset],[data-cwcheck],[data-cwshow],[data-cwclear],[data-vset]");
  if(!t)return;
  if(t.dataset.topic){if(state.edit)saveEdit();state.topic=t.dataset.topic;render();window.scrollTo(0,0)}
  else if(t.dataset.go!==undefined){var g=t.dataset.go;if(secById(g)){if(state.edit&&g!==state.sec)saveEdit();state.sec=g;render();window.scrollTo({top:$(".layout").offsetTop-10,behavior:"smooth"})}}
  else if(t.dataset.lb){$("#lbImg").src=IMG[t.dataset.lb];$("#lbCap").textContent=$("b",t).textContent;$("#lb").classList.add("on")}
  else if(t.hasAttribute("data-openall"))$$("details.cq").forEach(function(d){d.open=true});
  else if(t.hasAttribute("data-qcheck")){var ok=0,qs=$$(".q");qs.forEach(function(q){var a=+q.dataset.ans,sel=$("input:checked",q);
      $$("label",q).forEach(function(l,k){l.classList.toggle("right",k===a);l.classList.toggle("wrong",!!sel&&+sel.value===k&&k!==a)});q.classList.add("done");if(sel&&+sel.value===a)ok++});
    var mark=ok>=9?5:ok>=7?4:ok>=5?3:2,s=$("[data-score]");s.style.display="block";s.textContent="Natija: "+ok+" / "+qs.length+" to'g'ri — baho: "+mark;s.scrollIntoView({behavior:"smooth",block:"center"})}
  else if(t.hasAttribute("data-qreset")){render()}
  else if(t.hasAttribute("data-cwcheck")){var good=0,all=0;$$(".cw .c.on").forEach(function(c){var i=$("input",c);all++;var g=i.value.toUpperCase()===i.dataset.a;if(g)good++;c.classList.toggle("good",g&&i.value!=="");c.classList.toggle("badc",!g&&i.value!=="")});
    $("[data-cwres]").textContent=good===all?"🎉 Barakalla! Krossvord to'liq to'g'ri yechildi.":"To'g'ri kataklar: "+good+" / "+all}
  else if(t.hasAttribute("data-cwshow"))$$(".cw .c.on input").forEach(function(i){i.value=i.dataset.a});
  else if(t.hasAttribute("data-cwclear")){$$(".cw .c.on").forEach(function(c){$("input",c).value="";c.classList.remove("good","badc")});$("[data-cwres]").textContent=""}
  else if(t.hasAttribute("data-vset")){var v=$("[data-vurl]").value.trim();store.set("video:"+state.topic,v);$("[data-video]").innerHTML=videoEmbed(v)}
});
document.addEventListener("change",function(e){
  if(e.target.matches("[data-vfile]")&&e.target.files[0]){var u=URL.createObjectURL(e.target.files[0]);$("[data-video]").innerHTML='<video controls style="width:100%;height:100%" src="'+u+'"></video>'}
  if(e.target.matches(".q input")){var q=e.target.closest(".q"),a=+q.dataset.ans;$$("label",q).forEach(function(l,k){l.classList.toggle("right",k===a);l.classList.toggle("wrong",+e.target.value===k&&k!==a)});q.classList.add("done")}
});
document.addEventListener("input",function(e){
  if(e.target.matches("[data-gsearch]")){var v=e.target.value.toLowerCase();$$(".gloss tr").forEach(function(r,i){if(i)r.style.display=r.textContent.toLowerCase().indexOf(v)>=0?"":"none"})}
  if(e.target.matches(".cw input")){var c=e.target.closest(".c");c.classList.remove("good","badc");if(e.target.value){var nx=c.nextElementSibling;while(nx&&!nx.classList.contains("on"))nx=nx.nextElementSibling;if(nx)$("input",nx).focus()}}
});
$("#lb").onclick=function(){this.classList.remove("on")};
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-etab]");
  if(t){var card=t.closest(".embed"),list=JSON.parse(card.dataset.elist),it=list[+t.dataset.etab];
    $$("[data-etab]",card).forEach(function(x){x.setAttribute("aria-pressed",x===t)});
    $("[data-etitle]",card).textContent=it.t;$("[data-edesc]",card).textContent=it.d;var h=$("[data-embed]",card);h.dataset.embed=it.key;loadEmbed(h);return}
  var b=e.target.closest("[data-embedopen]");if(!b)return;
  var key=$("[data-embed]",b.closest(".embed")).dataset.embed;
  var u=URL.createObjectURL(new Blob([EMB[key]],{type:"text/html"}));var w=window.open(u,"_blank");if(!w)location.href=u});
document.addEventListener("click",function(e){var b=e.target.closest("[data-wsprint]");if(!b)return;
  var w=window.open("","_blank");if(!w){alert("Brauzer yangi oynani to'sib qo'ydi. PDF'ni yuklab olib chop eting.");return}
  w.document.write('<!doctype html><title>Ish varag\'i</title><style>@page{size:A4;margin:0}body{margin:0}img{width:210mm;height:297mm;display:block}</style><img src="'+IMG[b.dataset.wsprint]+'" onload="setTimeout(function(){print()},300)">');w.document.close()});
$("#printBtn").onclick=function(){render(true);setTimeout(function(){window.print();render()},400)};
document.addEventListener("keydown",function(e){if(e.key==="Escape")$("#lb").classList.remove("on")});
render();
window.__test={CONS:CONS,PARTS:PARTS,render:render,state:state,SECS:SECS,saveEdit:saveEdit,EDITS:EDITS,SRC:function(){return SRC}};
})();
</script>
